services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ycwy_chat
      POSTGRES_USER: ycwy
      POSTGRES_PASSWORD: ycwy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycwy -d ycwy_chat"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ycwy-chat-postgres18:/var/lib/postgresql

volumes:
  ycwy-chat-postgres18:
